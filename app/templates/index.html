{% extends "base.html" %}
{% block content %}
<h1 class="mt-4">Events</h1>
<div class="row">
    {% for event in events %}
    <div class="col-md-4 mb-4">
        <div class="card">
            <div class="card-body">
                <h5 class="card-title">{{ event.title }}</h5>
                <p class="card-text">{{ event.description or '' }}</p>
                <p><strong>Date:</strong> {{ event.date.strftime('%Y-%m-%d %H:%M') }}</p>
                <p><strong>Budget:</strong> ${{ event.budget or 0 }}</p>
                <a href="{{ url_for('event_detail', id=event.id) }}" class="btn btn-primary">View</a>
                <a href="{{ url_for('edit_event', id=event.id) }}" class="btn btn-secondary">Edit</a>
                <form action="{{ url_for('delete_event', id=event.id) }}" method="POST" style="display:inline;">
                    <button type="submit" class="btn btn-danger" onclick="return confirm('Delete?')">Delete</button>
                </form>
            </div>
        </div>
    </div>
    {% else %}
    <p>No events yet. <a href="{{ url_for('create_event') }}">Create one</a>.</p>
    {% endfor %}
</div>
{% endblock %}
